<html lang="fr">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@19/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@19/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/dexie@4/dist/dexie.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://unpkg.com/jspdf-autotable@3.8.1/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="https://unpkg.com/date-fns@4.1.0/esm/format.js" type="module"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
<body>

    // Configuration Tailwind
    tailwind.config = {
      theme: {
        extend: {}

    }
    
    // Base de données IndexedDB avec Dexie
    const db = new Dexie('ONGDatabase');
    db.version(1).stores({
      membres: 'id, nom, prenom, email, role, statut',
      projets: 'id, titre, responsable, statut, categorie',
      dons: 'id, donateur, email, montant, date, type, statut',
      transactions: 'id, libelle, montant, type, categorie, date, projetId',
      evenements: 'id, titre, date, type, statut, responsable',
      settings: 'key'
    });
    
    // Données initiales
    const initialData = {
      ong: {
        nom: 'Espoir & Solidarité',
        slogan: 'Ensemble, construisons un monde meilleur',
        email: 'contact@espoir-solidarite.org',
        telephone: '+225 07 00 00 00',
        adresse: 'Abidjan, Côte d\'Ivoire',
        siteWeb: 'www.espoir-solidarite.org',
        devise: 'FCFA',
      },
      membres: [
        { id: 'm1', nom: 'Kouassi', prenom: 'Ama', email: 'ama.kouassi@email.com', telephone: '+225 07 11 22 33', role: 'administrateur', statut: 'actif', dateAdhesion: '2021-03-15', adresse: 'Cocody, Abidjan' },
        { id: 'm2', nom: 'Traoré', prenom: 'Ibrahim', email: 'ibrahim.traore@email.com', telephone: '+225 05 44 55 66', role: 'coordinateur', statut: 'actif', dateAdhesion: '2021-06-20', adresse: 'Yopougon, Abidjan' },
        { id: 'm3', nom: 'N\'Guessan', prenom: 'Fatou', email: 'fatou.nguessan@email.com', telephone: '+225 01 77 88 99', role: 'benevole', statut: 'actif', dateAdhesion: '2022-01-10', adresse: 'Marcory, Abidjan' },
        { id: 'm4', nom: 'Bamba', prenom: 'Seydou', email: 'seydou.bamba@email.com', telephone: '+225 07 22 33 44', role: 'benevole', statut: 'actif', dateAdhesion: '2022-04-05', adresse: 'Abobo, Abidjan' },
        { id: 'm5', nom: 'Diallo', prenom: 'Mariama', email: 'mariama.diallo@email.com', telephone: '+225 05 55 66 77', role: 'donateur', statut: 'actif', dateAdhesion: '2023-02-14', adresse: 'Plateau, Abidjan' }
      ],
      projets: [
        { id: 'p1', titre: 'École Pour Tous', description: 'Construction de salles de classe', responsable: 'Ibrahim Traoré', statut: 'en_cours', dateDebut: '2024-01-15', dateFin: '2024-12-31', budget: 15000000, depenses: 8500000, categorie: 'Éducation', beneficiaires: 350, localisation: 'Région du Bélier', progression: 57 },
        { id: 'p2', titre: 'Eau Potable Village', description: 'Installation de pompes à eau', responsable: 'Ama Kouassi', statut: 'en_cours', dateDebut: '2024-03-01', dateFin: '2024-09-30', budget: 8000000, depenses: 5200000, categorie: 'Santé', beneficiaires: 1200, localisation: 'Région des Lacs', progression: 65 },
        { id: 'p3', titre: 'Formation Femmes', description: 'Formation en couture', responsable: 'Fatou N\'Guessan', statut: 'termine', dateDebut: '2023-06-01', dateFin: '2024-01-31', budget: 5000000, depenses: 4800000, categorie: 'Autonomisation', beneficiaires: 85, localisation: 'Abidjan', progression: 100 },
        { id: 'p4', titre: 'Reboisement 2024', description: 'Plantation de 10 000 arbres', responsable: 'Seydou Bamba', statut: 'planifie', dateDebut: '2024-07-01', dateFin: '2024-11-30', budget: 3000000, depenses: 0, categorie: 'Environnement', beneficiaires: 5000, localisation: 'National', progression: 0 }
      ],
      dons: [
        { id: 'd1', donateur: 'Mariama Diallo', email: 'mariama.diallo@email.com', montant: 500000, devise: 'FCFA', date: '2024-01-10', type: 'financier', projetId: 'p1', statut: 'recu', recu: true, notes: 'Don pour le projet éducation' },
        { id: 'd2', donateur: 'Société BTP Excellence', email: 'contact@btp-excellence.ci', montant: 2000000, devise: 'FCFA', date: '2024-02-15', type: 'financier', projetId: 'p1', statut: 'recu', recu: true, notes: 'Don entreprise partenaire' },
        { id: 'd3', donateur: 'Jean-Pierre Martin', email: 'jp.martin@gmail.com', montant: 1500000, devise: 'FCFA', date: '2024-03-05', type: 'financier', projetId: 'p2', statut: 'recu', recu: true, notes: 'Diaspora - Paris' },
        { id: 'd4', donateur: 'ONG Internationale AidWorld', email: 'grants@aidworld.org', montant: 5000000, devise: 'FCFA', date: '2024-04-01', type: 'financier', statut: 'recu', recu: true, notes: 'Subvention annuelle' },
        { id: 'd5', donateur: 'Koné Adama', email: 'adama.kone@email.com', montant: 250000, devise: 'FCFA', date: '2024-05-20', type: 'financier', statut: 'en_attente', recu: false, notes: '' }
      ],
      transactions: [
        { id: 't1', libelle: 'Don Mariama Diallo', montant: 500000, type: 'recette', categorie: 'Dons', date: '2024-01-10', projetId: 'p1', validee: true },
        { id: 't2', libelle: 'Achat matériaux construction', montant: 3200000, type: 'depense', categorie: 'Matériaux', date: '2024-01-25', projetId: 'p1', validee: true },
        { id: 't3', libelle: 'Don BTP Excellence', montant: 2000000, type: 'recette', categorie: 'Dons entreprises', date: '2024-02-15', projetId: 'p1', validee: true },
        { id: 't4', libelle: 'Salaires bénévoles février', montant: 450000, type: 'depense', categorie: 'Personnel', date: '2024-02-28', validee: true },
        { id: 't5', libelle: 'Subvention AidWorld', montant: 5000000, type: 'recette', categorie: 'Subventions', date: '2024-04-01', validee: true },
        { id: 't6', libelle: 'Achat pompes eau', montant: 2800000, type: 'depense', categorie: 'Équipements', date: '2024-04-10', projetId: 'p2', validee: true },
        { id: 't7', libelle: 'Frais de formation', montant: 350000, type: 'depense', categorie: 'Formation', date: '2024-05-05', projetId: 'p3', validee: true },
        { id: 't8', libelle: 'Don Jean-Pierre Martin', montant: 1500000, type: 'recette', categorie: 'Dons', date: '2024-03-05', projetId: 'p2', validee: true }
      ],
      evenements: [
        { id: 'e1', titre: 'Assemblée Générale Annuelle', description: 'Réunion annuelle', date: '2024-06-15', heure: '09:00', lieu: 'Hôtel Sofitel, Abidjan', type: 'reunion', statut: 'confirme', participants: 45, responsable: 'Ama Kouassi' },
        { id: 'e2', titre: 'Journée de collecte de fonds', description: 'Collecte pour projet eau', date: '2024-07-01', heure: '08:00', lieu: 'Place de la République, Abidjan', type: 'collecte', statut: 'planifie', participants: 20, responsable: 'Ibrahim Traoró' },
        { id: 'e3', titre: 'Formation Leadership', description: 'Formation coordinateurs', date: '2024-05-20', heure: '14:00', lieu: 'Siège de l\'ONG', type: 'formation', statut: 'termine', participants: 12, responsable: 'Fatou N\'Guessan' },
        { id: 'e4', titre: 'Campagne de sensibilisation', description: 'Sensibilisation hygiène', date: '2024-08-10', heure: '10:00', lieu: 'Région des Lacs', type: 'sensibilisation', statut: 'planifie', participants: 8, responsable: 'Seydou Bamba' }
      ]
    };
    
    // Initialiser la base de données
    async function initDB() {
      const count = await db.settings.count();
      if (count === 0) {
        await db.membres.bulkAdd(initialData.membres);
        await db.projets.bulkAdd(initialData.projets);
        await db.dons.bulkAdd(initialData.dons);
        await db.transactions.bulkAdd(initialData.transactions);
        await db.evenements.bulkAdd(initialData.evenements);
        await db.settings.put({ key: 'ong', value: initialData.ong });
      }
    }
    
    initDB();
    
    // Application React simplifiée
    const { useState, useEffect } = React;
    
    function App() {
      const [activeModule, setActiveModule] = useState('dashboard');
      const [data, setData] = useState(initialData);
      const [loading, setLoading] = useState(true);
      
      useEffect(() => {
        loadData();
      }, []);
      
      async function loadData() {
        const [membres, projets, dons, transactions, evenements] = await Promise.all([
          db.membres.toArray(),
          db.projets.toArray(),
          db.dons.toArray(),
          db.transactions.toArray(),
          db.evenements.toArray()
        ]);
        const ongSetting = await db.settings.get('ong');
        setData({
          membres: membres.length ? membres : initialData.membres,
          projets: projets.length ? projets : initialData.projets,
          dons: dons.length ? dons : initialData.dons,
          transactions: transactions.length ? transactions : initialData.transactions,
          evenements: evenements.length ? evenements : initialData.evenements,
          ong: ongSetting?.value || initialData.ong
        });
        setLoading(false);
      }
      
      if (loading) return React.createElement('div', { className: 'flex items-center justify-center h-screen' }, 'Chargement...');
      
      return React.createElement('div', { className: 'min-h-screen bg-gray-50' },
        React.createElement('div', { className: 'p-8' },
          React.createElement('h1', { className: 'text-3xl font-bold text-green-800' }, data.ong.nom),
          React.createElement('p', { className: 'text-gray-600 mt-2' }, data.ong.slogan),
          React.createElement('div', { className: 'grid grid-cols-4 gap-4 mt-8' },
            React.createElement('div', { className: 'bg-white p-4 rounded-lg shadow' },
              React.createElement('p', { className: 'text-gray-500' }, 'Membres'),
              React.createElement('p', { className: 'text-2xl font-bold' }, data.membres.length)
            ),
            React.createElement('div', { className: 'bg-white p-4 rounded-lg shadow' },
              React.createElement('p', { className: 'text-gray-500' }, 'Projets'),
              React.createElement('p', { className: 'text-2xl font-bold' }, data.projets.length)
            ),
            React.createElement('div', { className: 'bg-white p-4 rounded-lg shadow' },
              React.createElement('p', { className: 'text-gray-500' }, 'Dons'),
              React.createElement('p', { className: 'text-2xl font-bold text-green-600' }, 
                data.dons.filter(d => d.statut === 'recu').reduce((s, d) => s + d.montant, 0).toLocaleString() + ' FCFA'
              )
            ),
            React.createElement('div', { className: 'bg-white p-4 rounded-lg shadow' },
              React.createElement('p', { className: 'text-gray-500' }, 'Transactions'),
              React.createElement('p', { className: 'text-2xl font-bold' }, data.transactions.length)
            )
          ),
          React.createElement('div', { className: 'mt-8 bg-white p-6 rounded-lg shadow' },
            React.createElement('h2', { className: 'text-xl font-bold mb-4' }, 'Derniers membres'),
            React.createElement('div', { className: 'space-y-2' },
              data.membres.slice(0, 5).map(m => 
                React.createElement('div', { key: m.id, className: 'flex justify-between p-2 border-b' },
                  React.createElement('span', null, `${m.prenom} ${m.nom}`),
                  React.createElement('span', { className: 'text-gray-500' }, m.role)
                )
              )
            )
          )
        )
      );
    }
    
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
